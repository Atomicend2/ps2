name: PS2 Cloud Compiler

on: [push, pull_request]

jobs:
  build-game:
    runs-on: ubuntu-latest
    container: h4570/tyra:latest # Using the engine creator's dedicated image with Tyra pre-compiled

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile Code via Make
      run: |
        cd ps2-project
        make TYRA_DIR=/tyra

    - name: Upload Finished Game File
      uses: actions/upload-artifact@v4
      with:
        name: TheSeventhVow-PS2-Build
        path: ps2-project/BISCUS_970.00.ELF