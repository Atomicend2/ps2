name: PS2 Cloud Compiler

on: [push, pull_request]

jobs:
  build-game:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest # Official cloud environment with PS2SDK pre-installed

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Essentials (Make)
      run: |
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y make
        elif command -v apk >/dev/null 2>&1; then
          apk update && apk add make
        else
          echo "Package manager not found, attempting to continue..."
        fi

    - name: Compile Code via Make
      run: |
        cd ps2-project
        make TYRA=../tyra TYRA_DIR=../tyra TYRA_SRC=../tyra TYRA_HOME=../tyra ENGINEDIR=../tyra

    - name: Upload Finished Game File
      uses: actions/upload-artifact@v4
      with:
        name: TheSeventhVow-PS2-Build
        path: ps2-project/BISCUS_970.00.ELF